<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Aeon-GWI — Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --surface: #111318; --surface2: #181c24;
    --border: #232733; --accent: #f97316; --accent2: #3b82f6;
    --accent3: #10b981; --warn: #ef4444;
    --text: #e8eaf0; --muted: #6b7280; --gold: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse 70% 60% at 30% 20%, rgba(249,115,22,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 70% 80%, rgba(59,130,246,0.06) 0%, transparent 60%);
    pointer-events:none;
  }

  /* Grid bg */
  .grid-bg {
    position: fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(35,39,51,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(35,39,51,0.4) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
  }

  .login-wrap {
    position: relative; z-index: 1;
    display: flex; gap: 80px; align-items: center; justify-content: center;
    width: 100%; max-width: 980px; padding: 32px;
  }

  /* Right form */
  .login-card {
    width: 380px; flex-shrink:0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 36px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .card-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; }
  .card-subtitle { color:var(--muted); font-size:13px; margin-top:4px; }

  .form-group { margin-top:16px; }
  .form-label { font-size:11px; font-family:'Space Mono',monospace; color:var(--muted); letter-spacing:0.8px; margin-bottom:7px; display:block; }
  .form-input {
    width:100%; background:var(--surface2);
    border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; color:var(--text);
    font-size:14px; font-family:'DM Sans',sans-serif;
    transition:border-color 0.2s;
    outline:none;
  }
  .form-input:focus { border-color:var(--accent); }
  .form-input::placeholder { color:var(--muted); }

  .form-input-wrap { position:relative; }
  .eye-toggle {
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:16px; color:var(--muted);
    background:none; border:none; padding:0;
    transition:color 0.2s;
  }
  .eye-toggle:hover { color:var(--text); }

  .submit-btn {
    width:100%; margin-top:24px;
    background:var(--accent); color:#fff;
    border:none; border-radius:10px;
    padding:14px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:'Syne',sans-serif;
    transition:opacity 0.2s, transform 0.1s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .submit-btn:hover { opacity:0.9; transform:translateY(-1px); }
  .submit-btn:active { transform:translateY(0); }
  .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  .error-msg {
    margin-top:14px; padding:10px 14px;
    background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
    border-radius:8px; font-size:13px; color:#fca5a5;
    display:none;
  }

  .divider { height:1px; background:var(--border); margin:20px 0; }

  .session-note {
    font-size:11px; color:var(--muted); text-align:center;
    line-height:1.6;
  }

  .spinner {
    width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff; border-radius:50%;
    animation: spin 0.6s linear infinite; display:none;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .loading .spinner { display:block; }
  .loading .btn-text { display:none; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="login-wrap">
  <!-- Login Card -->
  <div class="login-card">
    <div class="card-title">Create Pilot Account</div>
    <div class="card-subtitle">Join Zero-Aeon-GWI Parametric Insurance</div>

    <div class="form-group">
      <label class="form-label" for="full_name">FULL NAME</label>
      <input class="form-input" type="text" id="full_name" name="full_name"
        placeholder="e.g. Raju Kumar">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">EMAIL ADDRESS</label>
      <input class="form-input" type="email" id="email" name="email"
        placeholder="rider@example.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">PHONE NUMBER</label>
      <input class="form-input" type="text" id="phone" name="phone"
        placeholder="e.g. 9876543210">
    </div>

    <div class="form-group">
      <label class="form-label" for="zone">CITY / ZONE</label>
      <input class="form-input" type="text" id="zone" name="zone"
        placeholder="e.g. Bangalore South">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">CREATE PASSWORD</label>
      <div class="form-input-wrap">
        <input class="form-input" type="password" id="password" name="password"
          placeholder="••••••••" autocomplete="new-password">
        <button class="eye-toggle" type="button" onclick="togglePwd()" id="eyeBtn">👁️</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="submit-btn" id="signupBtn">
      <div class="spinner" id="spinner"></div>
      <span class="btn-text">Sign Up & Join →</span>
    </button>

    <div style="display:flex; align-items:center; gap:10px; margin: 20px 0;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span style="font-size:12px; color:var(--muted); font-family:'Space Mono';">OR JOIN WITH</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <button class="submit-btn" id="googleBtn" style="background:var(--surface2); border:1px solid var(--border); color:var(--text); margin-top:0;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
      <span>Google Account</span>
    </button>

    <div class="divider"></div>
    <div style="text-align:center; font-size:13px; margin-bottom:14px;">
      Already have an ID? <a href="/login" style="color:var(--accent); text-decoration:none; font-weight:700;">Sign in here</a>
    </div>
    <div class="session-note" style="color:var(--accent3);">
      🛡️ Firebase Verified Authentication<br>
      A unique Rider ID will be assigned to you.
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    GoogleAuthProvider, 
    signInWithPopup,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSb_upwyqGUqWaInVajk_WzU8Ojqpbnnc",
    authDomain: "gig-work-insurence.firebaseapp.com",
    projectId: "gig-work-insurence",
    storageBucket: "gig-work-insurence.firebasestorage.app",
    messagingSenderId: "114084456891",
    appId: "1:114084456891:web:cb3df6bac2ded3fa143c9e",
    measurementId: "G-4G4LVSKKZQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  window.togglePwd = () => {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('eyeBtn').textContent = inp.type === 'password' ? '👁️' : '🙈';
  };

  async function handleBackendSync(user, name) {
    try {
      const response = await fetch('/auth/firebase-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uid: user.uid,
          email: user.email,
          name: name || user.displayName || user.email.split('@')[0]
        })
      });
      const data = await response.json();
      if (data.success) {
        window.location.href = data.redirect;
      } else {
        showError(data.detail || 'Backend sync failed');
      }
    } catch (e) {
      showError('Could not connect to local server');
    }
  }

  document.getElementById('signupBtn').onclick = async () => {
    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const zone = document.getElementById('zone').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('signupBtn');
    
    if (!full_name || !email || !password) return showError('Fill Name, Email and Password');
    
    btn.disabled = true;
    btn.classList.add('loading');
    
    try {
      const result = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(result.user, { displayName: full_name });
      await handleBackendSync(result.user, full_name);
    } catch (e) {
      showError(e.message);
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  };

  document.getElementById('googleBtn').onclick = async () => {
    try {
      const result = await signInWithPopup(auth, googleProvider);
      await handleBackendSync(result.user);
    } catch (e) {
      showError(e.message);
    }
  };

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent = '⚠️ ' + msg;
    err.style.display = 'block';
    setTimeout(() => { err.style.display = 'none'; }, 5000);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('signupBtn').click();
  });
</script>
</body>
</html>

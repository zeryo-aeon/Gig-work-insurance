name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: ${{ secrets.SPACE_NAME }}
        run: |
          # Copy the Hugging Face specific README over the GitHub README
          cp README-hf.md README.md
          
          # Remove large files to avoid Hugging Face push rejection
          find . -name "*.mp4" -type f -delete
          
          # Create a fresh git repo to wipe history containing large files
          rm -rf .git
          git init
          git checkout -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          # Add, commit, and push only the current state
          git add .
          git commit -m "Deploy to Hugging Face"
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          git push --force hf main

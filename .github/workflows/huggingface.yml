name: Build and Push Docker to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Hugging Face Registry
        uses: docker/login-action@v3
        with:
          registry: registry.hf.space
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace YOUR_HF_USERNAME and YOUR_SPACE_NAME accordingly
          tags: registry.hf.space/${{ secrets.HF_USERNAME }}/${{ secrets.SPACE_NAME }}:latest

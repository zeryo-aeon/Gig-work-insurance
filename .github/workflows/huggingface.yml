name: Build and Push Docker to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Hugging Face Registry
        uses: docker/login-action@v3
        with:
          registry: registry.hf.space
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Set lowercased image name
        run: |
          # Ensure the tag is lowercase and use a hyphen between username and space name
          echo "IMAGE_NAME=registry.hf.space/${{ secrets.HF_USERNAME }}-${{ secrets.SPACE_NAME }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
